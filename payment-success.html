<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM — Payment Status</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
.status-wrap{max-width:600px;margin:0 auto;padding:60px 16px;text-align:center}
.status-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:40px 24px}
.status-icon{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:32px}
.status-icon.ok{background:#e8f8ee;color:#1a9c4a}
.status-icon.fail{background:#fdecec;color:#d13a3a}
.status-icon.wait{background:var(--surface-2);color:var(--accent)}
.status-card h1{font-size:26px;letter-spacing:-0.03em}
.status-card p{color:var(--muted);margin-top:10px;line-height:1.6;font-size:14px}
.receipt{margin-top:20px;background:var(--surface-2);border-radius:12px;padding:16px;text-align:left;font-size:13px}
.receipt div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--border)}
.receipt div:last-child{border:none}
.status-actions{margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.status-actions a{padding:12px 20px;border-radius:999px;font-weight:700;font-size:13px}
.btn-dark{background:var(--accent);color:var(--on-accent)}
.btn-light{background:var(--surface);border:1px solid var(--accent);color:var(--accent)}
.retry{background:none;border:1px solid #ddd;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:13px}
</style>
  <script src="theme.js" defer></script>
</head>
<body>
<div class="header"><div class="container header-inner"><a href="index.html" class="logo"><span class="logo-mark">PRISM</span><span class="logo-dot">.</span><small>PAYMENT STATUS</small></a></div></div>

<div class="status-wrap">
  <div class="status-card">
    <div class="status-icon wait" id="icon"><i class="fa-solid fa-spinner fa-spin"></i></div>
    <h1 id="title">Verifying your payment...</h1>
    <p id="message">Please wait while we confirm your transaction with Paystack.</p>
    <div id="receiptBox" style="display:none"></div>
    <div class="status-actions" id="actions" style="display:none">
      <a href="index.html" class="btn-dark">Continue Shopping →</a>
      <a href="https://wa.me/2347046140421" class="btn-light"><i class="fa-brands fa-whatsapp"></i> Chat with us</a>
    </div>
  </div>
</div>

<script>
const icon = document.getElementById('icon');
const title = document.getElementById('title');
const message = document.getElementById('message');
const receiptBox = document.getElementById('receiptBox');
const actions = document.getElementById('actions');
const fmt = n => '₦' + Number(n).toLocaleString('en-NG') + '.00';
const params = new URLSearchParams(location.search);

let lastOrder = null;
try { lastOrder = JSON.parse(localStorage.getItem('prism_last_order') || 'null'); } catch (e) { lastOrder = null; }

const reference = params.get('reference') || params.get('trxref') || sessionStorage.getItem('prism_ref') || lastOrder?.reference;
const mode = params.get('mode') || (sessionStorage.getItem('prism_test') === '1' ? 'test' : 'live');

function showResult(state, heading, text, receipt) {
  icon.className = 'status-icon ' + (state === 'success' ? 'ok' : state === 'wait' ? 'wait' : 'fail');
  icon.innerHTML = state === 'success' ? '<i class="fa-solid fa-check"></i>'
    : state === 'fail' ? '<i class="fa-solid fa-xmark"></i>'
    : '<i class="fa-solid fa-spinner fa-spin"></i>';
  title.textContent = heading;
  message.innerHTML = text;
  if (receipt) {
    receiptBox.style.display = 'block';
    receiptBox.innerHTML = receipt;
  }
  actions.style.display = 'flex';
}

async function verify(attempt) {
  if (!reference) {
    showResult('fail', 'No payment reference found',
      'If you completed a payment, please contact us on WhatsApp so we can check it for you.');
    return;
  }

  try {
    const res = await fetch('/api/verify?reference=' + encodeURIComponent(reference) + '&mode=' + mode);
    const data = await res.json();

    if (!res.ok) {
      // Paystack can briefly return "not found" right after redirect - retry once.
      if (attempt === 0 && /not found|pending/i.test(data.error || '')) {
        setTimeout(() => verify(1), 1500);
        return;
      }
      throw new Error(data.error || 'Verification failed.');
    }

    if (data.success || data.status === 'success') {
      const items = (data.items && data.items.length) ? data.items : (lastOrder?.items || []);
      const lines = [
        '<div><span>Reference</span><b>' + data.reference + '</b></div>',
        '<div><span>Amount Paid</span><b>' + fmt(data.amount) + '</b></div>',
        '<div><span>Status</span><b style="color:#1a9c4a">Successful</b></div>'
      ];
      if (items.length) lines.push('<div><span>Items</span><b>' + items.map(i => i.name + ' x' + (i.qty || 1)).join(', ') + '</b></div>');
      if (data.customer?.email) lines.push('<div><span>Email</span><b>' + data.customer.email + '</b></div>');

      showResult('success', 'Payment Successful!',
        'Thank you, <strong>' + (data.customer?.name || 'for shopping with PRISM') + '</strong>. Your order is confirmed. We will contact you shortly on ' + (data.customer?.phone || 'the number you provided') + '.',
        lines.join(''));

      // Clear the cart ONLY after a confirmed success.
      localStorage.removeItem('prism_cart');
      localStorage.removeItem('prism_last_order');
    } else {
      showResult('fail', 'Payment Not Completed',
        'Your payment status is "<strong>' + data.status + '</strong>". If you were charged, contact us on WhatsApp with reference <strong>' + data.reference + '</strong>.',
        '<div><span>Reference</span><b>' + data.reference + '</b></div>');
    }
  } catch (err) {
    showResult('fail', 'Could Not Verify Payment',
      (err.message || 'Please try again.') + ' If you completed payment, contact us on WhatsApp with your reference.',
      reference ? '<div><span>Reference</span><b>' + reference + '</b></div>' : '');
  }
}

verify(0);
</script>
</body>
</html>
