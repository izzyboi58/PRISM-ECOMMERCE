<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM — Payment Status</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
.status-wrap{max-width:600px;margin:0 auto;padding:60px 16px;text-align:center}
.status-card{background:white;border:1px solid #eee;border-radius:18px;padding:40px 24px}
.status-icon{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:32px}
.status-icon.ok{background:#e8f8ee;color:#1a9c4a}
.status-icon.fail{background:#fdecec;color:#d13a3a}
.status-icon.wait{background:#eef3ff;color:#2e3236}
.status-card h1{font-size:26px;letter-spacing:-0.03em}
.status-card p{color:#6b7280;margin-top:10px;line-height:1.6;font-size:14px}
.receipt{margin-top:20px;background:#f8f8f8;border-radius:12px;padding:16px;text-align:left;font-size:13px}
.receipt div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}
.receipt div:last-child{border:none}
.status-actions{margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.status-actions a{padding:12px 20px;border-radius:999px;font-weight:700;font-size:13px}
.btn-dark{background:#2e3236;color:white}
.btn-light{background:white;border:1px solid #2e3236;color:#2e3236}
</style>
</head>
<body>
<div class="header"><div class="container header-inner"><a href="index.html" class="logo"><span class="logo-mark">PRISM</span><span class="logo-dot">.</span><small>PAYMENT STATUS</small></a></div></div>

<div class="status-wrap">
  <div class="status-card">
    <div class="status-icon wait" id="icon"><i class="fa-solid fa-spinner fa-spin"></i></div>
    <h1 id="title">Verifying your payment...</h1>
    <p id="message">Please wait while we confirm your transaction with Paystack.</p>
    <div id="receiptBox" style="display:none"></div>
    <div class="status-actions" id="actions" style="display:none">
      <a href="index.html" class="btn-dark">Continue Shopping →</a>
      <a href="https://wa.me/2347046140421" class="btn-light"><i class="fa-brands fa-whatsapp"></i> Chat with us</a>
    </div>
  </div>
</div>

<script>
const icon = document.getElementById('icon');
const title = document.getElementById('title');
const message = document.getElementById('message');
const receiptBox = document.getElementById('receiptBox');
const actions = document.getElementById('actions');
const fmt = n => '₦' + Number(n).toLocaleString('en-NG') + '.00';

async function verify() {
  const params = new URLSearchParams(location.search);
  const reference = params.get('reference') || sessionStorage.getItem('prism_ref');
  const test = params.get('test') || sessionStorage.getItem('prism_test') || '0';
  if (!reference) { fail('No payment reference found.'); return; }

  try {
    const res = await fetch(`/api/verify?reference=${encodeURIComponent(reference)}&test=${test}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Verification failed.');

    if (data.status === 'success') {
      icon.className = 'status-icon ok';
      icon.innerHTML = '<i class="fa-solid fa-check"></i>';
      title.textContent = 'Payment Successful!';
      message.innerHTML = `Thank you <strong>${data.customer?.name || 'for shopping with PRISM'}</strong>. Your order is confirmed. A receipt has been sent to <strong>${data.customer?.email || 'your email'}</strong>.`;
      receiptBox.style.display = 'block';
      receiptBox.innerHTML = `
        <div><span>Reference</span><b>${data.reference}</b></div>
        <div><span>Amount Paid</span><b>${fmt(data.amount)}</b></div>
        <div><span>Status</span><b style="color:#1a9c4a">Successful</b></div>
        ${(data.items||[]).length ? `<div><span>Items</span><b>${data.items.map(i=>i.name+' x'+(i.qty||1)).join(', ')}</b></div>` : ''}
      `;
      actions.style.display = 'flex';
      // Clear the cart only AFTER a confirmed success
      localStorage.removeItem('prism_cart');
      localStorage.removeItem('prism_last_order');
    } else {
      fail(`Your payment status is "${data.status}". If you were charged, please contact us with reference ${data.reference}.`);
    }
  } catch (err) {
    fail(err.message + ' If you completed payment, contact us on WhatsApp with your reference.');
  }
}

function fail(msg) {
  icon.className = 'status-icon fail';
  icon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
  title.textContent = 'Payment Not Completed';
  message.textContent = msg;
  actions.style.display = 'flex';
}

verify();
</script>
</body>
</html>
